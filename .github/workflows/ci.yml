name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

# Cancel superseded runs for the same branch / PR so only the latest commit burns minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (type-check, lint, css, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint CSS (Stylelint)
        run: npm run lint:css

      # Dependency vulnerability scan. Report-only: known advisories are transitive
      # (next / postcss / ws) and not fixable without a major bump, so this surfaces
      # findings in the log without blocking merges.
      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high || true

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
