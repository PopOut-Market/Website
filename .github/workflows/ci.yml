name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

# Cancel superseded runs for the same branch / PR so only the latest commit burns minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (type-check, lint, css, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint CSS (Stylelint)
        run: npm run lint:css

      # Dependency vulnerability scan. Report-only: known advisories are transitive
      # (next / postcss / ws) and not fixable without a major bump, so this surfaces
      # findings in the log without blocking merges.
      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high || true

  format:
    name: Prettier (changed files)
    # Runs on PRs (diff vs the base branch) AND on direct pushes (diff vs the
    # previous commit), so changed files are format-checked either way. Only the
    # files touched are checked — pre-existing unformatted files are left alone.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] \
              || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            else
              BASE="$BEFORE"
            fi
          fi
          echo "Diff base: $BASE"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No Prettier-relevant files changed."
            exit 0
          fi
          echo "Checking changed files:"
          echo "$FILES" | tr ' ' '\n'
          npx prettier --check --ignore-unknown $FILES

  build:
    name: Build & link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      # Pinned to an exact version: `linkinator@6` (floating) started crashing on the
      # runner with "unsettled top-level await" (exit 13) after a Node bump — a tooling
      # crash unrelated to any real broken link. 7.6.1 is the maintained line and runs
      # clean; pin it exactly so a future floating release can't silently break CI again.
      - name: Check internal links (linkinator)
        run: npx --yes linkinator@7.6.1 http://localhost:3000 --recurse --skip "^(?!https?://localhost:3000)"
